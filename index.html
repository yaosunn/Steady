function addChange(track, dir, k, v, date){ S.state.changes.push({date: date || today(), track, dir, k, v:v||{}}); }
function addWin(id, k, v, date){
  if (S.state.wins.some(w => w.id === id)) return null;
  const w = {id, k: k || id, v: v || {}, date: date || today()}; S.state.wins.push(w); return w;
}
function changeText(c){
  if (c.text) return c.text;
  const v = {...c.v};
  if (v.to) v.to = exName(v.to);
  if (v.from) v.from = exName(v.from);
  if (v.feel) v.feel = t('feel.' + v.feel);
  if (v.why) v.why = t('why.' + v.why);
  if (v.track) v.track = t('tr.' + v.track);
  if (v.alt) v.alt = t('alt.' + v.alt);
  if (v.list) v.list = v.list.map(([tr, id]) => `${t('tr.'+tr)}: ${exName(id)}`).join(LANG === 'zh' ? '；' : '; ');
  return t('chg.' + c.k, v);
}
function winText(w){
  if (w.text) return w.text;
  const k = w.k || w.id;
  if (k === 'pb') return t('win.pb', {...w.v, name: exName(w.v.id)});
  if (k === 'streak') return t('win.streak', w.v);
  return t('win.' + k, w.v);
}
function setPB(key, v, date){
  const prev = S.state.pbs[key];
  if (!prev || v > prev.v){ S.state.pbs[key] = {v, date}; return prev ? prev.v : null; }
  return undefined;
}
function regress(track, res, date){
  const tk = S.state.tracks[track], from = tk.level, to = Math.max(0, from - 1);
  tk.good = 0; tk.bad = 0; tk.ready = null;
  if (to < from){ tk.returnTo = Math.max(tk.returnTo ?? 0, from); tk.level = to; }
  const c = {dir:'down', k:'pain', v:{track, to:stepOf(track,to).id, moved: to < from, alt:track}};
  addChange(track, 'down', c.k, c.v, date); res.changes.push(c);
  tk.pain = true;
}
function evalCardio(track, sess, res, kindOk){
  const r = sess.run, tk = S.state.tracks[track], date = sess.date;
  if (!(kindOk && !sess.busy && r.level === tk.level)) return;
  const good = r.completed === 'yes' && r.rating !== 'hard';
  const bad = r.rating === 'hard' || r.completed === 'no';
  const need = (tk.returnTo != null && tk.level < tk.returnTo) ? 1 : 2;
  const st = stepOf(track, tk.level), last = TRACKS[track].steps.length - 1;
  if (good){
    tk.good++; tk.bad = 0;
    if (tk.good >= need && tk.level < last){
      tk.good = 0; tk.level++;
      if (tk.returnTo != null && tk.level >= tk.returnTo) tk.returnTo = null;
      const c = {dir:'up', k:'upRun', v:{to:stepOf(track, tk.level).id, from:st.id, feel:r.rating === 'easy' ? 'easy' : 'right', fast:need === 1}};
      addChange(track, 'up', c.k, c.v, date); res.changes.push(c);
    } else if (tk.level < last) res.notes.push(t('note.goodRun', {n:exName(st.id), k:need - tk.good}));
  } else if (bad){
    tk.bad++; tk.good = 0;
    if (tk.bad >= 2 && tk.level > 0){
      tk.bad = 0; tk.level--;
      const c = {dir:'down', k:'downRun', v:{to:stepOf(track, tk.level).id}};
      addChange(track, 'down', c.k, c.v, date); res.changes.push(c);
    } else res.notes.push(t('note.toughRun', {n:exName(st.id)}));
  } else { tk.good = 0; tk.bad = 0; }
}
function processSession(sess){
  const res = {changes:[], notes:[], wins:[]};
  const date = sess.date;
  const pain = new Set((sess.hurt && sess.hurt.tracks) || []);
  const seen = new Set();
  const winP = (id, k, v) => { const w = addWin(id, k, v, date); if (w) res.wins.push(w); };

  for (const ex of (sess.exercises || [])){
    if (!ex.sets || !ex.sets.length || ex.stepId.startsWith('smp-')) continue;
    const best = Math.max(...ex.sets.map(s => +s.v || 0));
    const prevPB = setPB(ex.stepId, best, date);
    if (ex.kind === 'hold' && typeof prevPB === 'number' && best > prevPB) winP(`pb-${ex.stepId}-${best}`, 'pb', {id:ex.stepId, v:best, was:prevPB});
    if (ex.stepId === 'pu-full' && best >= 1) winP('first-pushup');
    if (ex.stepId === 'pu-full' && best >= 10) winP('pushup-10');
    if (ex.stepId === 'pl-neg' && best >= 1) winP('first-negative');
    if (ex.stepId === 'pl-strict' && best >= 1) winP('first-pullup');
    if (ex.stepId === 'hs-ctw' && best >= 30) winP('ctw-30');
    if ((ex.stepId === 'hs-free' || ex.stepId === 'hs-toepull') && best >= 3) winP('first-free');
    if ((ex.stepId === 'hs-free' || ex.stepId === 'hs-toepull') && best >= 10) winP('free-10');
    if ((ex.stepId === 'hs-tuckpress' || ex.stepId === 'hs-straddlepress') && best >= 1) winP(ex.stepId === 'hs-tuckpress' ? 'first-tuckpress' : 'first-straddlepress');
    if (ex.stepId === 'hs-bail' && best >= 3) winP('first-bail');
    if (ex.stepId === 'co-lsit' && best >= 10) winP('lsit-10');
    if (ex.stepId === 'lg-pistol' && best >= 1) winP('first-pistol');
  }

  if (sess.type === 'cal' || sess.type === 'skill'){
    for (const ex of sess.exercises){
      const tr = ex.track; if (ex.practice || seen.has(tr)) continue;
      seen.add(tr);
      const tk = S.state.tracks[tr];
      if (pain.has(tr)){ regress(tr, res, date); continue; }
      tk.pain = false;
      if (ex.skipped || !ex.sets.length || sess.busy || tk.level !== ex.level) continue;
      const vals = ex.sets.map(s => +s.v || 0);
      const complete = vals.length >= ex.sets_target && vals.every(v => v >= ex.lo);
      const lightest = bandList()[0];
      const bandOk = !stepOf(tr, tk.level).bandGate || !lightest || ex.sets.every(x => x.band === lightest);
      const top = vals.length >= ex.sets_target && vals.every(v => v >= ex.hi) && bandOk;
      const easyish = ex.rating === 'easy' || ex.rating === 'right';
      const need = (tk.returnTo != null && tk.level < tk.returnTo) ? 1 : 2;
      const st = stepOf(tr, tk.level), last = TRACKS[tr].steps.length - 1;
      const feel = ex.rating === 'easy' ? 'easy' : 'right';
      const desc = `${ex.sets_target}×${ex.hi}${ex.kind === 'hold' ? t('unit.s') : ''}`;
      if (top && easyish){
        tk.good++; tk.bad = 0;
        if (tk.good >= need){
          tk.good = 0;
          if (tk.level >= last){ res.notes.push(t('note.topHold', {n:exName(st.id)})); continue; }
          if (need === 2 && upsThisWeek(date) > 0){
            tk.ready = tk.ready || date;
            res.notes.push(t('note.queued', {n:exName(st.id), nx:exName(stepOf(tr, tk.level+1).id)}));
            continue;
          }
          tk.level++; tk.ready = null;
          if (tk.returnTo != null && tk.level >= tk.returnTo) tk.returnTo = null;
          const c = {dir:'up', k:'up', v:{to:stepOf(tr, tk.level).id, desc, feel, fast:need === 1}};
          addChange(tr, 'up', c.k, c.v, date); res.changes.push(c);
        } else res.notes.push(t('note.oneMore', {n:exName(st.id), feel:t('feel.' + feel)}));
      } else if (ex.rating === 'hard' || !complete){
        tk.bad++; tk.good = 0;
        if (tk.bad >= 2){
          tk.bad = 0;
          tk.ready = null;
          if (tk.level > 0){
            tk.level--;
            const c = {dir:'down', k:'down', v:{to:stepOf(tr, tk.level).id, from:st.id, why:ex.rating === 'hard' ? 'hard' : 'short'}};
            addChange(tr, 'down', c.k, c.v, date); res.changes.push(c);
          } else res.notes.push(t('note.hardTwice', {n:exName(st.id)}));
        } else res.notes.push(t(complete ? 'note.holdHard' : 'note.holdShort', {n:exName(st.id)}));
      } else { tk.good = 0; tk.bad = 0; }
    }
  }

  if (sess.type === 'run' && sess.run){
    const r = sess.run;
    if (r.mode === 'rope'){
      winP('rope-first');
      if (r.nonstop) setPB('rope-nonstop', +r.mainMin || 0, date);
      if (r.nonstop && (+r.mainMin||0) >= 10) winP('rope-10');
      if (r.nonstop && (+r.mainMin||0) >= 20) winP('rope-20');
      if (pain.has('rope')) regress('rope', res, date);
      else { S.state.tracks.rope.pain = false; evalCardio('rope', sess, res, r.kind === 'stage'); }
      seen.add('rope');
    } else if (r.mode !== 'indoor'){
      const miles = r.units === 'km' ? (+r.distance||0) / 1.609 : (+r.distance||0);
      if (r.nonstop) setPB('run-nonstop', +r.mainMin || 0, date);
      if (miles) setPB('run-dist', +(+r.distance).toFixed(2), date);
      if (r.nonstop && miles >= 1) winP('first-mile');
      if (r.nonstop && (+r.mainMin||0) >= 20) winP('first-20');
      if (miles >= 3.1) winP('first-5k');
      if (pain.has('run')) regress('run', res, date);
      else { S.state.tracks.run.pain = false; evalCardio('run', sess, res, r.kind === 'stage' || r.kind === 'long'); }
      seen.add('run');
    }
  }
  for (const tr of pain) if (!seen.has(tr) && TRACKS[tr]) regress(tr, res, date);

  if (S.state.ramp && date > S.state.ramp.until) S.state.ramp = null;
  if (floorMet(weekStart(date))){
    winP('first-floor');
    const n = floorStreak();
    for (const k of [2,4,8,12,26,52]) if (n >= k) winP(`streak-${k}`, 'streak', {n:k});
  }
  return res;
}

/* "Move up one ladder at a time per week": a passed ladder waits for next week if another already moved */
function upsThisWeek(date){
  const ws = weekStart(date);
  return S.state.changes.filter(c => c.dir === 'up' && STR_ORDER.includes(c.track) && (c.k === 'up' || c.k === 'upQueued') && !(c.v && c.v.fast) && weekStart(c.date) === ws).length;
}
function promoteReady(){
  if (upsThisWeek(today()) > 0) return false;
  const ready = STR_ORDER.filter(tr => S.state.tracks[tr].ready).sort((a,b) => S.state.tracks[a].ready < S.state.tracks[b].ready ? -1 : 1);
  if (!ready.length) return false;
  const tr = ready[0], tk = S.state.tracks[tr];
  tk.ready = null; tk.good = 0; tk.bad = 0;
  if (tk.level < TRACKS[tr].steps.length - 1) tk.level++;
  addChange(tr, 'up', 'upQueued', {to:stepOf(tr, tk.level).id});
  return true;
}

/* returning after a break */
function checkReturn(){
  if (!S.state.baselineDone) return;
  const last = trainingSessions().slice(-1)[0];
  if (!last || S.state.returnHandled === last.id) return;
  const gap = daysBetween(last.date, today());
  if (gap < 9) return;
  S.state.returnHandled = last.id;
  if (gap > 45){ S.state.needRetest = true; S.state.welcome = {gap, mode:'retest', date:today(), seen:false}; commit(); return; }
  const back = gap <= 20 ? 1 : 2;
  stepBackAll(back);
  addChange(null, 'down', 'return', {gap, back});
  S.state.ramp = {until: addDays(today(), back === 1 ? 7 : 14)};
  S.state.welcome = {gap, back, date:today(), seen:false};
  commit();
}
function stepBackAll(back){
  for (const tr of ALL_TRACKS){
    const tk = S.state.tracks[tr], from = tk.level, to = Math.max(0, from - back);
    tk.good = 0; tk.bad = 0; tk.ready = null;
    if (to < from){ tk.returnTo = Math.max(tk.returnTo ?? 0, from); tk.level = to; }
  }
}

function baseSteps(){
  const rope = cardioMode() === 'rope';

  return [
    {k:'push', fig:'pu-full', fields:[{id:'pushFull', kind:'reps'}, {id:'pushKnee', kind:'reps', optional:true}]},
    {k:'hang', fig:'pl-hang', fields:[{id:'hang', kind:'hold'}, {id:'pullups', kind:'reps', optional:true}, {id:'rows', kind:'reps', optional:true}]},
    {k:'dip', fig:'dp-bench', fields:[{id:'benchDips', kind:'reps'}, {id:'support', kind:'hold', optional:true}]},
    {k:'hand', fig:'hs-pikehold', fields:[{id:'pikeHold', kind:'hold'}, {id:'crow', kind:'hold', optional:true}, {id:'ctw', kind:'hold', optional:true}]},
    {k:'core', fig:'co-comp2', fields:[{id:'hollow', kind:'hold'}, {id:'compBoth', kind:'reps', optional:true}, {id:'tuckL', kind:'hold', optional:true}]},
    {k:'legs', fig:'test-kneewall', fields:[{id:'squats', kind:'reps'}, {id:'ankle', kind:'num'}, {id:'chair', kind:'reps', optional:true}]},
    {k:'planche', fig:'pc-lean', fields:[{id:'lean', kind:'hold', optional:true}]},
    rope ? {k:'rope', fig:'fig-rope', fields:[{id:'ropeSec', kind:'hold'}], timer:10*60}
         : {k:'run', fig:'fig-run', fields:[{id:'jogMin', kind:'num'}, {id:'dist', kind:'num', optional:true}], timer:20*60},
  ];
}
/* each test gets the diagram of the move it measures */
const FIELD_FIG = {pushFull:'pu-full', pushKnee:'pu-knee', hang:'pl-hang', pullups:'pl-strict', rows:'pl-row', benchDips:'dp-bench', support:'dp-support',
  pikeHold:'hs-pikehold', crow:'hs-crow', ctw:'hs-ctw', hollow:'co-hollow', compBoth:'co-comp2', tuckL:'co-lsit', squats:'lg-squat', ankle:'test-kneewall',
  chair:'lg-chair', lean:'pc-lean', ropeSec:'fig-rope', jogMin:'fig-run'};
const ankleUnit = () => S.state.settings.units === 'km' ? 'cm' : 'in';
function placement(v){
  const n = k => +v[k] || 0, has = k => v[k] !== undefined && v[k] !== '', L = {}, why = {};
  const fp = n('pushFull'), kp = n('pushKnee');
  L.push = fp >= 12 ? 4 : fp >= 8 ? 3 : (fp >= 1 || kp >= 10) ? 2 : kp >= 5 ? 1 : 0;
  why.push = t('why.base.push', {fp, kp});
  const h = n('hang'), pu = n('pullups'), rw = n('rows');
  L.pull = pu >= 5 ? 7 : pu >= 1 ? 6 : rw >= 12 ? 3 : h >= 45 ? 1 : 0;
  why.pull = t('why.base.pull', {pu, h, rw});
  const bd = n('benchDips'), sp = n('support');
  L.dip = sp >= 30 && bd >= 15 ? 3 : bd >= 15 ? 1 : 0;
  why.dip = t('why.base.dip', {bd, sp});
  /* press handstand: freestanding work waits behind bail practice, so a strong wall hold places at bail (step 6) */
  const ph = n('pikeHold'), cr = n('crow'), cw = n('ctw');
  L.handstand = cw >= 30 ? 5 : cw >= 10 || cr >= 20 ? 4 : cr >= 10 ? 3 : ph >= 30 ? 2 : ph >= 15 ? 1 : 0;
  why.handstand = t('why.base.handstand', {ph, cr, cw});
  const ho = n('hollow'), cb = n('compBoth'), tl = n('tuckL');
  L.core = tl >= 15 ? 5 : cb >= 8 ? 4 : cb >= 5 ? 3 : ho >= 30 ? 2 : ho >= 20 ? 1 : 0;
  why.core = t('why.base.core', {ho, cb, tl});
  const sq = n('squats'), ch = n('chair'), ak = n('ankle'), cm = ankleUnit() === 'cm' ? ak : ak * 2.54;
  L.legs = ch >= 5 ? 5 : ch >= 1 ? 4 : sq >= 30 ? 2 : sq >= 20 ? 1 : 0;
  /* knee-to-wall: under 5 cm (2 in) ankles come first; 5-10 cm (2-4 in) stops short of pistol work; 10 cm (4 in)+ is fine */
  if (cm < 5) L.legs = 0; else if (cm < 10) L.legs = Math.min(L.legs, 2);
  why.legs = t('why.base.legs', {sq, ch, ak, u:ankleUnit(), tight:cm < 10});
  const ln = n('lean'); L.planche = ln >= 20 ? 1 : 0; why.planche = t('why.base.planche', {v:ln});
  if (cardioMode() === 'rope'){
    const rs = n('ropeSec');
    L.rope = rs >= 600 ? 5 : rs >= 180 ? 4 : rs >= 120 ? 3 : rs >= 60 ? 2 : rs >= 45 ? 1 : 0; why.rope = t('why.base.rope', {v:rs});
  } else {
    const jm = n('jogMin'); L.run = jm >= 20 ? 5 : jm >= 10 ? 4 : jm >= 5 ? 3 : jm >= 3 ? 2 : jm >= 1.5 ? 1 : 0; why.run = t('why.base.run', {v:jm});
    L.rope = Math.min(1, Math.floor(L.run / 2));
  }
  return {L, why};
}

function initAudio(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){} }
function beep(n=1, freq=880){
  try { navigator.vibrate && navigator.vibrate(n > 1 ? [120,80,120] : 160); } catch(e){}
  if (!actx) return;
  try {
    for (let i=0;i<n;i++){
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + i*0.22;
      o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+0.18);
      o.start(t0); o.stop(t0+0.2);
    }
  } catch(e){}
}

function nextUp(){
  let best = null;
  for (const tr of [...STR_ORDER, cardioMode()]){
    const tk = S.state.tracks[tr], steps = TRACKS[tr].steps;
    if (tk.level >= steps.length-1) continue;
    const need = (tk.returnTo != null && tk.level < tk.returnTo) ? 1 : 2, left = need - tk.good;
    if (!best || left < best.left) best = {tr, left, tk};
  }
  if (!best) return null;
  const {tr, left, tk} = best, st = stepOf(tr, tk.level), nx = stepOf(tr, tk.level+1);
  if (tr === 'run' || tr === 'rope') return t('next.run', {nx:exName(nx.id), n:left, cur:exName(st.id)});

/* ---- progress ---- */
function isHold(stepId){ for (const tr of ALL_TRACKS){ const s = TRACKS[tr].steps.find(x => x.id === stepId); if (s) return s.kind === 'hold'; } return false; }
function ring(i, n){
  const C = 2 * Math.PI * 18, f = n > 1 ? i / (n - 1) : 1;
  return `<svg class="ring" viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="18"/><circle class="fg" cx="22" cy="22" r="18" stroke-dasharray="${(C * Math.max(.04, f)).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 22 22)"/><text x="22" y="22">${i+1}/${n}</text></svg>`;
}
function viewProgress(){
  const parts = [`<section class="hello"><h1>${t('pr.h')}</h1><p class="muted">${t('pr.short')}</p></section>`];
  const cm = cardioMode();
  for (const tr of [...STR_ORDER, cm, cm === 'rope' ? 'run' : 'rope']){
    if (tr === 'rope' && cm !== 'rope' && !S.state.ropePlaced) continue;
    const tk = S.state.tracks[tr], steps = TRACKS[tr].steps, cardio = tr === 'run' || tr === 'rope';
    const need = (tk.returnTo != null && tk.level < tk.returnTo) ? 1 : 2, cur = steps[tk.level];
    const crit = cardio ? t('pr.critRun',{n:need - tk.good}) : t('pr.crit',{t:`${cur.sets}×${cur.hi} ${unitLabel(cur)}`, g:tk.good, n:need});
    const paused = cardio && tr !== cm;
    const pill = paused ? `<span class="pill">${t('pr.paused')}</span>` : tk.pain ? `<span class="pill warn">${t('pr.easing')}</span>` : tk.ready ? `<span class="pill sun">${t('pr.ready')}</span>` : tk.returnTo != null ? `<span class="pill sun">${t('pr.fast')}</span>` : '';
    parts.push(`<details class="card path" data-path="${tr}" ${ui.openPath === tr ? 'open' : ''}>
      <summary>${ring(tk.level, steps.length)}<span class="pp"><span class="eyebrow">${t('tr.'+tr)}</span><span class="t">${esc(exName(cur.id))}</span><span class="tiny muted">${esc(tk.level === steps.length-1 ? t('pr.top') : crit)}</span></span>${pill}</summary>
      <div class="ladder" style="padding-top:16px">${steps.map((s,i) => {
        const cls = i < tk.level ? 'done' : i === tk.level ? 'now' : 'later';
        const pb = S.state.pbs[s.id];
        let meta = '';
        if (i === tk.level+1) meta = t('pr.next');
        if (!cardio && i > tk.level) meta += (meta ? ' · ' : '') + t('pr.pass', {t:`${s.sets} × ${s.hi} ${unitLabel(s)}`});
        if (pb && i <= tk.level) meta += (meta ? ' · ' : '') + t('pr.best',{v:pb.v + (s.kind==='hold' ? t('unit.s') : '')});
        const btn = !!figFor(s.id) && !cardio, tag = btn ? 'button' : 'div';
        return `<${tag} class="rung ${cls}" ${btn ? `data-a="how" data-v="${s.id}"` : ''}><span class="node"></span><span><span class="nm">${esc(exName(s.id))}${i===tk.level ? ` <span class="pill cal">${t('pr.now')}</span>` : ''}</span>${meta ? `<span class="meta" style="display:block">${esc(meta)}</span>` : ''}${btn ? `<span class="see" style="display:block">${t('pr.see')} ›</span>` : ''}</span></${tag}>`;
      }).join('')}</div>
    </details>`);
  }
  const pbs = Object.entries(S.state.pbs);
  const pbLabel = k => k === 'run-dist' ? t('pb.run-dist',{u:t('se.'+S.state.settings.units)}) : (k === 'run-nonstop' || k === 'rope-nonstop') ? t('pb.'+k) : exName(k);
  const wins = S.state.wins.slice().reverse();
  parts.push(`<details class="more"><summary><span>${t('pr.extras')}</span><span class="chev">›</span></summary><div class="stack" style="padding-top:14px">
    <section class="card stack"><h3>${t('pr.wins')}</h3>${wins.length ? `<div class="list">${wins.map(w => `<div class="li"><span class="pill sun">★</span><div class="body"><div>${esc(winText(w))}</div><div class="tiny muted">${fmtDate(w.date)}</div></div></div>`).join('')}</div>` : `<p class="small muted">${t('pr.wins.none')}</p>`}</section>
    <section class="card stack"><h3>${t('pr.pbs')}</h3>${pbs.length ? `<div class="pbs">${pbs.map(([k,p]) => `<span>${esc(pbLabel(k))}</span><span class="v">${p.v}${isHold(k) ? ' ' + t('unit.s') : ''}</span>`).join('')}</div>` : `<p class="small muted">${t('pr.pbs.none')}</p>`}</section>
  </div></details>
  <details class="more"><summary><span>${t('pr.how')}</span><span class="chev">›</span></summary><div class="card" style="margin-top:14px"><p class="small">${t('pr.p')}</p></div></details>`);
  return parts.join('');
}

/* ---- history ---- */
function viewHistory(){
  const d = today(), thisWs = weekStart(d);
  const first = S.sessions.length ? weekStart(S.sessions[0].date) : thisWs;
  const nWeeks = Math.min(26, Math.max(6, Math.round(daysBetween(first, thisWs)/7) + 1));
  const byDate = {};
  S.sessions.forEach(s => (byDate[s.date] = byDate[s.date] || []).push(s));
  let cal = `<div class="calgrid">${t('hi.days').map(x=>`<span class="h">${x}</span>`).join('')}<span class="h">${t('hi.floor')}</span>`;
  for (let w = nWeeks-1; w >= 0; w--){
    const ws = addDays(thisWs, -7*w);
    for (let i=0;i<7;i++){
      const day = addDays(ws, i), ss = byDate[day] || [];
      const cls = ['d']; if (day > d) cls.push('fut'); if (day === d) cls.push('today');
      cal += `<button class="${cls.join(' ')}" data-a="hist-day" data-v="${day}" aria-label="${fmtDate(day)}${ss.length?': '+ss.map(s=>esc(sessionTitle(s))).join(', '):''}"><span>${parseISO(day).getDate()}</span><span class="ds">${ss.map(s => `<i class="${TRAINING.includes(s.type)?s.type:'other'}"></i>`).join('')}</span></button>`;
    }
    const met = floorMet(ws);
    cal += `<span class="wk ${met?'met':'miss'}">${met ? '✓' : ws === thisWs ? '…' : '·'}</span>`;
  }
  cal += '</div>';
  const parts = [`<section class="hello"><h1>${t('hi.h')}</h1><p class="muted small">${t('hi.p')}</p></section>`,
    trendsSection(),
    `<section class="card stack">${cal}<div class="row wrapr small muted"><span class="row" style="gap:5px"><span class="dot cal f"></span>${t('type.cal')}</span><span class="row" style="gap:5px"><span class="dot run f"></span>${t('type.cardio')}</span><span class="row" style="gap:5px"><span class="dot skill f"></span>${t('type.skill')}</span></div></section>`];
  if (ui.histOpen){
    const ss = byDate[ui.histOpen] || [];
    parts.push(`<section class="card stack"><h3>${fmtDate(ui.histOpen, {weekday:'long', month:'long', day:'numeric'})}</h3>${ss.length ? ss.map(s => sessionDetail(s)).join('') : `<p class="small muted">${t('hi.none')}</p>`}${S.steps[ui.histOpen] ? `<p class="small">${t('hi.steps')} <span class="mono">${(+S.steps[ui.histOpen]).toLocaleString()}</span></p>` : ''}${daySleep(ui.histOpen) != null || dayProtein(ui.histOpen) != null || dayFluid(ui.histOpen) ? `<p class="small">${[daySleep(ui.histOpen) != null ? t('hi.sleep', {v:daySleep(ui.histOpen)}) : '', dayProtein(ui.histOpen) != null ? t('hi.protein', {v:dayProtein(ui.histOpen)}) : '', dayFluid(ui.histOpen) ? t('hi.fluid', {v:fmtL(dayFluid(ui.histOpen))}) : ''].filter(Boolean).join(' · ')}</p>` : ''}</section>`);
  }
  const lastWs = addDays(thisWs, -7);
  if (weekSessions(lastWs).length) parts.push(weekCard(lastWs, t('wk.last')));
  const recent = S.sessions.slice().reverse().slice(0, 30);
  parts.push(`<section class="card stack"><h3>${t('hi.past')}</h3>${recent.length ? recent.map(s => `<details class="sess"><summary><span><b>${esc(sessionTitle(s))}</b><br><span class="tiny muted">${fmtDate(s.date)}${s.busy?' · '+t('hi.busy'):''}${s.effort?' · '+t('hi.effort',{n:s.effort}):''}</span></span><span class="pill ${TRAINING.includes(s.type)?s.type:'sun'}">${typeLabel(s.type, s.run && s.run.mode)}</span></summary>${sessionDetail(s, true)}</details>`).join('') : `<p class="small muted">${t('hi.empty')}</p>`}</section>`);
  return parts.join('');
}
function sessionDetail(s, inDetails){
  const rows = [];
  if (!inDetails) rows.push(`<p><b>${esc(sessionTitle(s))}</b> <span class="tiny muted">${typeLabel(s.type, s.run && s.run.mode)}${s.busy?' · '+t('hi.busy'):''}</span></p>`);
  (s.exercises||[]).forEach(e => { const u = e.kind === 'hold' ? t('unit.s') : ''; rows.push(`<div class="small"><b>${esc(exName(e.stepId) || e.name)}</b> <span class="mono muted">${e.skipped ? t('hi.skipped') : (e.sets || []).map(x => x.v + u + (x.band?' ('+esc(x.band)+')':'')).join(' · ')}</span>${e.rating?` <span class="tiny muted">· ${ratingWord(e.rating)}${e.rir?', '+t('hi.left',{n:e.rir}):''}</span>`:''}</div>`); });
  if (s.run && s.type === 'run'){
    const r = s.run;
    rows.push(`<dl class="kv">${r.distance?`<dt>${t('hi.dist')}</dt><dd class="mono">${esc(r.distance)} ${esc(t('se.'+r.units))}</dd>`:''}${r.time?`<dt>${t('hi.time')}</dt><dd class="mono">${esc(r.time)}</dd>`:''}${r.ratio?`<dt>${t('hi.ratio')}</dt><dd class="mono">${esc(ratioText(r.ratio))}</dd>`:''}${r.hr?`<dt>${t('hi.hr')}</dt><dd class="mono">${esc(r.hr)}</dd>`:''}<dt>${t('hi.felt')}</dt><dd>${ratingWord(r.rating)||'—'}</dd>${r.addon ? `<dt>${t('ao.count', {n:r.addon.done.length})}</dt><dd>${r.addon.done.map(id => esc(exName(id))).join(', ') || '—'}</dd>` : ''}</dl>`);
  }
  const meta = [];
  if (s.effort) meta.push(t('hi.effort',{n:s.effort}));
  if (s.energy) meta.push(t('hi.energy',{v:t('fin.'+s.energy)}));
  if (s.sleep != null && s.sleep !== '') meta.push(t('hi.sleep',{v:s.sleep}));

  if (s.note) rows.push(`<p class="small">${esc(s.note)}</p>`);
  rows.push(`<button class="btn ghost danger" style="align-self:flex-start;padding:0" data-a="del-session" data-v="${s.id}">${ui.delArm===s.id?t('hi.delsure'):t('hi.del')}</button>`);
  return `<div class="stack" style="gap:6px;padding-top:8px">${rows.join('')}</div>`;
}

    const x = i * bw + gap / 2, w = Math.max(1.5, bw - gap);
    if (v == null) g += `<rect class="none" x="${x}" y="${H-1.5}" width="${w}" height="1.5"/>`;
    else { const h = Math.max(2, Math.min(H, v / max * H)); g += `<rect class="${ds.cls}" x="${x}" y="${H-h}" width="${w}" height="${h}" rx="${Math.min(2, w/2)}"><title>${esc(bs[i].lbl)}: ${esc(ds.fmt(v))}</title></rect>`; }
  });
  if (ref && !ds.sum){ const y = H - ref / max * H; g += `<line class="ref" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`; }
  const k = t('gl.' + rg.kind);
  return `<section class="card stack" style="gap:8px">
    <div class="row between"><h3>${t('ds.' + ds.k)}</h3><span style="text-align:right">${cur != null && (cur || ds.sum) ? `<b>${esc(ds.fmt(cur))}</b> <span class="tiny muted">${t(ds.sum ? 'ds.total' : 'ds.avg')}</span>` : `<span class="tiny muted">${t('ds.none')}</span>`}</span></div>
    ${deltaTxt(cur, pv, ds.fmt, k)}
    <svg class="hb" viewBox="0 0 ${W} ${H+1}" role="img" aria-label="${t('ds.' + ds.k)}">${g}</svg>
    <div class="hb-axis"><span>${esc(bs[0].lbl)}</span><span>${esc(bs[n-1].lbl)}</span></div>
  </section>`;
}
function trendsSection(){
  const kind = ui.hk || 'week', off = ui.ho || 0, rg = periodRange(kind, off), prev = samePace(rg, periodRange(kind, off - 1));
  return `<section class="stack" style="gap:12px">
    <div class="row between"><h2>${t('hi.trends')}</h2></div>
    <div class="seg">${['week','month','year'].map(x => `<button class="${kind === x ? 'on' : ''}" data-a="hk" data-v="${x}">${t('pk.' + x)}</button>`).join('')}</div>
    <div class="row between"><button class="btn ghost" data-a="ho" data-v="-1" aria-label="${t('pk.prev')}">‹</button><b>${esc(rg.label)}</b><button class="btn ghost" data-a="ho" data-v="1" aria-label="${t('pk.next')}" ${off >= 0 ? 'disabled' : ''}>›</button></div>
    ${kind !== 'year' ? glanceCard(glance(kind, off)) : ''}
    ${DATASETS.map(ds => dsCard(ds, rg, prev)).join('')}
  </section>`;
}
A.hk = el => { ui.hk = el.dataset.v; ui.ho = 0; render(); };
A.ho = el => { ui.ho = Math.min(0, (ui.ho || 0) + (+el.dataset.v)); render(); };

async function offerFile(filename, data){
  if (window.STEADY_STANDALONE){
    const type = filename.endsWith('.csv') ? 'text/csv' : 'application/json';
    try {
      const file = new File([data], filename, {type});
      if (navigator.canShare && navigator.canShare({files:[file]}) && matchMedia('(pointer:coarse)').matches){ await navigator.share({files:[file], title:filename}); toast(t('ex.shared')); return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast(t('ex.saved')); return;
    } catch(e){ if (e && e.name === 'AbortError') return; }
  }
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl){ await dl.save({filename, data}); toast(t('ex.saved')); return; }
  } catch(e){ if (e && e.code === 'declined') return; }
  $('#exportBox').innerHTML = `<div class="stack" style="gap:8px;padding-top:6px"><p class="small">${esc(t('ex.nodl',{f:filename}))}</p>
    <textarea class="input mono tiny" id="exportText" readonly style="min-height:140px">${esc(data)}</textarea><button class="btn" data-a="copy-export">${t('ex.copy')}</button></div>`;
}
A['copy-export'] = () => {
  const el = $('#exportText');
  const fallback = () => { el.focus(); el.select(); toast(t('ex.sel')); };
  try { navigator.clipboard.writeText(el.value).then(() => toast(t('ex.copied')), fallback); } catch(e){ fallback(); }
};
A['export-json'] = () => offerFile(`steady-backup-${today()}.json`, JSON.stringify(exportObj(), null, 1));
A['export-csv'] = () => offerFile(`steady-log-${today()}.csv`, csv());
function importData(text){
  let d;
  try { d = JSON.parse(text); } catch(e){ toast(t('im.bad')); return; }
  if (!d || d.app !== 'steady' || !d.state || !Array.isArray(d.sessions)){ toast(t('im.notours')); return; }
  const oldMonths = S.sessions.map(s => s.date.slice(0,7));
  S = {state:hydrate(d.state), sessions:d.sessions, steps:d.steps||{}, daily:d.daily||{}};
  S.state.deleted = [];
  migrate();
  if (sync.db) sync.dirtyMonths = new Set([...oldMonths, ...S.sessions.map(s => s.date.slice(0,7))]);
  commit([]); ui.importText = ''; applyLang(); render(); toast(t('im.ok',{n:S.sessions.length}));
}
A['import-paste'] = () => importData($('#imp-text').value);

/* =====================================================================
   EVENTS, TICKER, BOOT
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (A[el.dataset.a]) A[el.dataset.a](el, e);
});
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset.in; if (!k) return;
  if (k === 'base') B.vals[el.dataset.k] = el.value.trim();
  else if (k === 'run'){ W.run.log[el.dataset.k] = el.value; saveActive(); }
  else if (k === 'f-note'){ W.f.note = el.value; saveActive(); }
  else if (k === 'f-steps'){ W.f.steps = el.value.replace(/\D/g,''); saveActive(); }
  else if (k === 'f-sleep'){ const v = el.value.replace(',', '.').trim(); W.f.sleep = v === '' ? null : v; saveActive(); }
  else if (k === 'me') meNeedNote();
  else if (k === 'import-text') ui.importText = el.value;
  else if (k === 'smp-set') SMP.sets[+el.dataset.i] = el.value;
  else if (k === 'smp-note') SMP.note = el.value;
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.in; if (!k) return;
  if (k === 'steps'){ const n = el.value.replace(/\D/g,''); if (n) S.steps[today()] = +n; else delete S.steps[today()]; commit(); render(); }
  else if (k === 'setting'){ const key = el.dataset.k; S.state.settings[key] = key === 'stepGoal' ? (+el.value.replace(/\D/g,'') || 10000) : el.value; commit(); render(); }
  else if (k === 'd-sleep'){ const v = el.value.replace(',', '.').trim(); setDaily(today(), {sleep: v === '' || isNaN(+v) ? null : +v}); }
  else if (k === 'd-extra'){ const v = el.value.replace(/[^\d.]/g, ''); setDaily(today(), {extra: v === '' ? undefined : +v}); render(); }
  else if (k === 'fd-weight'){ const v = parseFloat(el.value.replace(',', '.')); FD().weight = isNaN(v) || v <= 0 ? null : Math.round((wUnit() === 'lb' ? v / 2.2046 : v) * 10) / 10; commit(); render(); }
  else if (k === 'meal-name'){ const m = FD().plan.find(x => x.id === el.dataset.m); if (m){ m.name = el.value.trim() || null; FD().example = false; commit(); } }
  else if (k === 'meal-add'){ const m = FD().plan.find(x => x.id === el.dataset.m); if (m && el.value){ const ex = m.items.find(i => i.f === el.value); if (ex) ex.q += 1; else m.items.push({f:el.value, q:1}); foodEdited(); } }
  else if (k === 'me'){ const v = profileVals(); v[el.dataset.k] = el.value; saveProfile(v); commit(); if (el.dataset.k === 'meals') render(); }
  else if (k === 'import-file'){ const f = el.files && el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importData(String(r.result)); r.readAsText(f); }
});
/* hold timer: 3-second get-ready countdown, then counts up with beeps at the low and high end of the target */
function holdTick(h, clockSel, lblSel, barSel, lo, hi, now){
  const c = $(clockSel), l = $(lblSel);
  if (!h.start){
    const left = Math.ceil((h.ready - now)/1000);
    if (left < h.lastCount && left > 0){ h.lastCount = left; beep(1, 660); }
    if (now >= h.ready){
      h.start = h.ready; beep(1, 1040);
      if (c) c.classList.remove('ready');
      if (l) l.textContent = t('hold.go');
      const btn = document.querySelector('[data-a="hold-stop"]'); if (btn) btn.textContent = t('hold.stop');
    } else { if (c){ c.textContent = String(Math.max(1,left)); c.classList.add('ready'); } return; }
  }
  const sec = (now - h.start)/1000;
  if (c) c.textContent = fmtClock(sec);
  if (lo && !h.lo && sec >= lo){ h.lo = true; beep(1, 880); if (l) l.textContent = t('hold.hit'); }
  if (hi && !h.hi && sec >= hi){ h.hi = true; beep(2, 990); if (l) l.textContent = t('hold.top'); }
  const b = barSel && $(barSel); if (b && hi) b.style.width = Math.min(100, sec/(hi*1.25)*100) + '%';
}
function tick(){
  const now = Date.now();
  if (B && B.hold) holdTick(B.hold, '#baseHold', '#baseHoldLbl', null, 0, 0, now);
  if (B && B.timer && B.timer.start){ const c = $('#baseClock'); const left = (B.timer.total || 1200) - (now - B.timer.start)/1000; if (c) c.textContent = fmtClock(left); if (left <= 0){ B.timer = null; beep(3); render(); } }
  if (!W) return;
  if (W.phase === 'warmup' && W.warmUntil){
    const left = (W.warmUntil - now)/1000, c = $('#warmClock');
    if (c) c.textContent = fmtClock(left);
    if (left <= 0){ W.warmUntil = null; W.phase = 'set'; beep(2); saveActive(); if (tab === 'log') render(); }
  }
  if (W.phase === 'rest'){
    const left = (W.restUntil - now)/1000, c = $('#restClock');
    if (c) c.textContent = fmtClock(left);
    if (left <= 0){ W.phase = 'set'; beep(2); saveActive(); if (tab === 'log') render(); }
  }
  if (W.hold && W.plan.items){ const it = W.plan.items[W.i]; holdTick(W.hold, '#holdClock', '#holdLbl', '#holdBar', it.lo, it.hi, now); }
  if (W.run && W.phase === 'go'){
    const r = W.run, sg = W.plan.segments[r.idx];
    if (!sg) return;
    const segMs = r.segElapsed + (r.segResume ? now - r.segResume : 0);
    if (segMs >= sg.sec*1000 && r.segResume){ runAdvance(sg.sec*1000); saveActive(); if (tab === 'log') render(); return; }
    const c = $('#segClock'); if (c) c.textContent = fmtClock(sg.sec - segMs/1000);
    const total = W.plan.segments.reduce((a,s)=>a+s.sec,0), el = r.totalSec + segMs/1000;
    const e = $('#runElapsed'); if (e) e.textContent = fmtClock(el);
    const b = $('#runBar'); if (b) b.style.width = Math.min(100, el/total*100) + '%';
  }
}
setInterval(tick, 200);
/* remember which folded sections are open across re-renders */
document.addEventListener('toggle', e => {
  const el = e.target;
  if (el.id === 'more') ui.moreOpen = el.open;
  if (el.dataset && el.dataset.path){ if (el.open) ui.openPath = el.dataset.path; else if (ui.openPath === el.dataset.path) ui.openPath = null; }
}, true);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && W && tab === 'log') holdWake(); });

/* bring records saved by the first version up to date */
let migratedNow = false;
function migrateLadders(){
  if ((S.state.v || 1) >= 3) return;
  const MAP = {handstand:{'hs-plank':0,'hs-wallplank':1,'hs-pike':2,'hs-ctw':4,'hs-walk':5,'hs-free':6}, pull:{'pl-hang':0,'pl-scap':1,'pl-bandh':3,'pl-bandl':3,'pl-neg':5,'pl-strict':6}, push:{'pu-incline':1,'pu-knee':2,'pu-full':3,'pu-diamond':4,'pu-archer':6}, legs:{'lg-squat':1,'lg-split':2,'lg-pistol':5}, core:{'co-deadbug':0,'co-hollow':0,'co-lsit':3}};
  if (S.state.baselineDone){
    for (const tr of Object.keys(OLD_IDS)){
      const tk = S.state.tracks[tr], ids = OLD_IDS[tr], at = l => MAP[tr][ids[Math.max(0, Math.min(l, ids.length-1))]] ?? 0;
      const lvl = at(tk.level);
      tk.returnTo = tk.returnTo != null && at(tk.returnTo) > lvl ? at(tk.returnTo) : null;
      tk.level = lvl; tk.good = 0; tk.bad = 0; tk.ready = null;
    }
    addChange(null, 'up', 'ladderUpdate', {});
    const first = trainingSessions()[0];
    S.state.cycleStart = S.state.cycleStart || (first ? first.date : today());
  }
  S.state.v = 3; migratedNow = true;
}
let floorRaised = false;
function migrate(){
  if (S.state.setupDone === undefined || (S.state.baselineDone && !S.state.setupDone)) S.state.setupDone = !!S.state.baselineDone;
  migrateLadders();
  /* the Bar & Road plan's floor: three strength days a week (A, B, C) */
  if ((S.state.v || 1) < 4){ if (S.state.settings.calDays < 3) S.state.settings.calDays = 3; S.state.v = 4; floorRaised = true; }
  if ((S.state.v || 1) < 5){
    const MAP5 = {legs:[0,1,2,3,4,6,7,8,9,12], core:[0,1,2,6,7,8,9,10]};
    if (S.state.baselineDone) for (const tr of Object.keys(MAP5)){
      const tk = S.state.tracks[tr], m = MAP5[tr], at = l => m[Math.max(0, Math.min(l, m.length-1))];
      tk.level = at(tk.level); if (tk.returnTo != null) tk.returnTo = at(tk.returnTo);
    }
    S.state.v = 5; floorRaised = true;
  }
  if ((S.state.v || 1) < 6){
    /* kick-up and freestanding steps are gone: anyone there starts at bail practice */
    const MAP6 = {handstand:[0,1,2,3,4,5,5], core:[0,1,2,3,4,4,4,5,6,7,8]};
    if (S.state.baselineDone) for (const tr of Object.keys(MAP6)){
      const tk = S.state.tracks[tr], m = MAP6[tr], at = l => m[Math.max(0, Math.min(l, m.length-1))];
      tk.level = at(tk.level); if (tk.returnTo != null) tk.returnTo = at(tk.returnTo); tk.ready = null;
    }
    S.state.v = 6; floorRaised = true;
  }
  for (const ex of S.sessions.flatMap(x => x.exercises || [])) if (ex.stepId && ex.stepId.startsWith('sampler-')) ex.stepId = 'smp-' + samplerIdx(ex.stepId.slice(8));
  if (!S.state.ropePlaced && S.state.baselineDone && S.state.settings.cardio !== 'rope') S.state.tracks.rope = newTrack(Math.min(1, Math.floor(S.state.tracks.run.level / 2)));
}
loadLocal();
migrate();
applyLang();
loadActive();
if (migratedNow){ W = null; saveActive(); }
if (promoteReady() || migratedNow || floorRaised) commit();
checkReturn();
render();
initSync();
</script>
